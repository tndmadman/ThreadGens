name: Kokoro Audio Regression

on:
  push:
  pull_request:

jobs:
  kokoro-audio-regression:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install NumPy
        run: python -m pip install --disable-pip-version-check numpy

      - name: Verify torch-like Kokoro audio normalization
        run: python tools/kokoro_audio_regression_test.py
