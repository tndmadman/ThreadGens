name: History Parser Regression

on:
  push:
  pull_request:

jobs:
  ubuntu:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Compile Java sources
        run: javac -d out src/redditTxtToImg/*.java

      - name: Run history parser regression
        run: java -Djava.awt.headless=true -cp out redditTxtToImg.HistoryParserRegressionTest

  windows:
    runs-on: windows-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Compile Java sources
        shell: powershell
        run: |
          New-Item -ItemType Directory -Force -Path out | Out-Null
          $javaFiles = Get-ChildItem -Path src\redditTxtToImg -Filter '*.java' | ForEach-Object { $_.FullName }
          & javac -d out $javaFiles
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Run history parser regression
        shell: powershell
        run: |
          & java '-Djava.awt.headless=true' -cp out redditTxtToImg.HistoryParserRegressionTest
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
