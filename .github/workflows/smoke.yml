name: Smoke Test

on:
  push:
  pull_request:

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Install FFmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg

      - name: Compile Java sources
        run: javac -d out src/redditTxtToImg/*.java

      - name: Run P0 unit smoke tests
        run: java -Djava.awt.headless=true -cp out redditTxtToImg.P0SmokeTest

      - name: Run P0 video smoke tests for all formats
        run: java -Djava.awt.headless=true -cp out redditTxtToImg.P0VideoSmokeTest

      - name: Run P2 scoring and history smoke tests
        run: java -Djava.awt.headless=true -cp out redditTxtToImg.P2SmokeTest

      - name: Run P2 real-media fingerprint smoke test
        run: java -Djava.awt.headless=true -cp out redditTxtToImg.P2ArtifactSmokeTest

      - name: Run production Reddit image generation smoke test
        run: java -cp out redditTxtToImg.CheckedRunner data/comments.txt output --platform reddit --count 1 --prefix smoke --no-novelty

      - name: Verify Reddit smoke image
        shell: bash
        run: |
          test -f output/0smoke.png
          test ! -f data/publish_history.jsonl

      - name: Run production X image generation smoke test
        run: java -cp out redditTxtToImg.CheckedRunner data/comments.txt output --platform x --count 1 --prefix xsmoke --no-novelty

      - name: Verify X smoke image
        shell: bash
        run: test -f output/0xsmoke.png

      - name: Run explicit raw renderer compatibility smoke test
        run: java -cp out redditTxtToImg.RawCheckedRunner data/comments.txt output --platform reddit --count 1 --prefix rawsmoke

      - name: Verify raw compatibility image
        shell: bash
        run: test -f output/0rawsmoke.png

      - name: Run local OP image overlay through production path
        shell: bash
        run: |
          printf 'iVBORw0KGgoAAAANSUhEUgAAAAEAAAABCAIAAACQd1PeAAAADElEQVR4nGP4z8AAAAMBAQDJ/pLvAAAAAElFTkSuQmCC' | base64 -d > op.png
          java -cp out redditTxtToImg.CheckedRunner data/comments.txt output --platform reddit --count 1 --prefix localimg --image-mode local --op-image op.png --no-novelty
          test -f output/0localimg.png

      - name: Fail when requested input cannot regenerate stale output
        shell: bash
        run: |
          mkdir -p output
          touch output/0missing.png
          ! java -cp out redditTxtToImg.CheckedRunner missing.txt output --count 1 --prefix missing --no-novelty
          test ! -f output/0missing.png

      - name: Fail when video is requested without TTS
        shell: bash
        run: |
          ! java -cp out redditTxtToImg.P2Entrypoint data/comments.txt output --count 1 --prefix badvideo --video --no-novelty

  windows-validation:
    runs-on: windows-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Compile Java sources on Windows
        shell: powershell
        run: |
          New-Item -ItemType Directory -Force -Path out | Out-Null
          $javaFiles = Get-ChildItem -Path src\redditTxtToImg -Filter '*.java' | ForEach-Object { $_.FullName }
          & javac -d out $javaFiles
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Run P2 unit smoke tests on Windows
        shell: powershell
        run: |
          & java '-Djava.awt.headless=true' -cp out redditTxtToImg.P2SmokeTest
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Parse Windows PowerShell launchers
        shell: powershell
        run: |
          $files = @('setup_windows.ps1', 'tools\run_ai_windows.ps1', 'tools\batch_create_videos.ps1')
          foreach ($file in $files) {
            $tokens = $null
            $errors = $null
            [System.Management.Automation.Language.Parser]::ParseFile((Resolve-Path $file), [ref]$tokens, [ref]$errors) | Out-Null
            if ($errors.Count -gt 0) {
              $errors | ForEach-Object { Write-Error "${file}: $($_.Message)" }
              exit 1
            }
          }