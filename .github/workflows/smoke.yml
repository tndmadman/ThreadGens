name: Smoke Test

on:
  push:
  pull_request:

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Compile Java sources
        run: javac -d out src/redditTxtToImg/*.java

      - name: Run P0 unit smoke tests
        run: java -Djava.awt.headless=true -cp out redditTxtToImg.P0SmokeTest

      - name: Run checked Reddit image generation smoke test
        run: java -cp out redditTxtToImg.CheckedRunner data/comments.txt output --platform reddit --count 1 --prefix smoke

      - name: Verify Reddit smoke image
        shell: bash
        run: test -f output/0smoke.png

      - name: Run checked X image generation smoke test
        run: java -cp out redditTxtToImg.CheckedRunner data/comments.txt output --platform x --count 1 --prefix xsmoke

      - name: Verify X smoke image
        shell: bash
        run: test -f output/0xsmoke.png

      - name: Run P0 Reddit integrity smoke test
        run: java -Djava.awt.headless=true -cp out redditTxtToImg.P0Entrypoint data/comments.txt output --platform reddit --count 1 --prefix p0smoke --format debate --no-novelty

      - name: Verify P0 smoke image
        shell: bash
        run: test -f output/0p0smoke.png

      - name: Run local OP image overlay smoke test
        shell: bash
        run: |
          printf 'iVBORw0KGgoAAAANSUhEUgAAAAEAAAABCAIAAACQd1PeAAAADElEQVR4nGP4z8AAAAMBAQDJ/pLvAAAAAElFTkSuQmCC' | base64 -d > op.png
          java -cp out redditTxtToImg.CheckedRunner data/comments.txt output --platform reddit --count 1 --prefix localimg --image-mode local --op-image op.png
          test -f output/0localimg.png

      - name: Fail when requested input cannot regenerate stale output
        shell: bash
        run: |
          mkdir -p output
          touch output/0missing.png
          ! java -cp out redditTxtToImg.CheckedRunner missing.txt output --count 1 --prefix missing
          test ! -f output/0missing.png

      - name: Fail when video is requested without TTS
        shell: bash
        run: |
          ! java -cp out redditTxtToImg.P0Entrypoint data/comments.txt output --count 1 --prefix badvideo --video
