plugins {
    id 'application'
}

group = 'tndmadman'
version = '0.5.0-p0-originality'

repositories {
    mavenCentral()
}

sourceSets.main.java.srcDirs = ['src']

application {
    mainClass = 'redditTxtToImg.P0Runner'
}

jar {
    archiveBaseName = 'ThreadGens'
    manifest {
        attributes 'Main-Class': 'redditTxtToImg.P0Runner'
    }
}
