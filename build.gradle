plugins {
    id 'application'
}

group = 'tndmadman'
version = '0.7.0-p0-p1-p2-integrated'

repositories {
    mavenCentral()
}

sourceSets.main.java.srcDirs = ['src']

application {
    mainClass = 'redditTxtToImg.P2Entrypoint'
}

jar {
    archiveBaseName = 'ThreadGens'
    manifest {
        attributes 'Main-Class': 'redditTxtToImg.P2Entrypoint'
    }
}
